[project]
name = "sudo"
version = "0.1.0"
description = "Surrogate-Assisted Double Machine Learning (SUDO)"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.65",
    "doubleml>=0.11.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sudo"]
